[project]
name = "prediction-lab"
version = "0.2.0"
description = "Personal lab for honest, probabilistic horse-racing prediction."
readme = "README.md"
# Pinned to a range rather than an open ">=3.12": uv otherwise picks whatever
# interpreter it finds first, and on an Apple Silicon Mac that can be an x86_64
# Homebrew build running under Rosetta -- where Polars' wheels fail for want of
# AVX. .python-version pins the exact version so uv fetches its own native build.
requires-python = ">=3.12,<3.14"
dependencies = [
    "polars>=1.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.8",
    "typer>=0.12",
    "duckdb>=1.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
]

[project.scripts]
predlab = "predlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predlab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH"]
ignore = ["E501"]
# French prose and maths in docstrings and reports.
allowed-confusables = ["α", "−", "–", "’", "×"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
